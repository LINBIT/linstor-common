syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.linbit.linstor.api.grpc";
option java_outer_classname = "RscGrpProto";

package linbit.linstor;

import "common.proto";

message RGAdjustReq {

}

message ResourceGroupModifyRequest {
  string rsc_group_name = 1;
  optional string description = 2;
  PropsModify props_mod = 3;
  optional uint32 peer_slots = 4;
  repeated string snap_names = 5;
  bool copy_all_snaps = 6;
}
