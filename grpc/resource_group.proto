syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.linbit.linstor.api.grpc";
option java_outer_classname = "RscGrpProto";

package linbit.linstor;

import "auto_select_filter.proto";
import "common.proto";
import "google/protobuf/field_mask.proto";

enum VolumeGroupFlag {
  // volume sizes given for this volume group are gross sizes (including
  // metadata) instead of net (usable) sizes
  GROSS_SIZE = 0;
}

message VolumeGroup {
  uint32 volume_number = 1;
  map<string, string> props = 2;
  repeated VolumeGroupFlag flags = 3;
  // unique object id
  Uuid uuid = 4;
}

message ResourceGroup {
  string name = 1;
  string description = 2;
  map<string, string> props = 3;
  optional AutoSelectFilter select_filter = 4;
  optional uint32 peer_slots = 5;
  // unique object id
  Uuid uuid = 6;
  repeated VolumeGroup volume_groups = 7;
}

message ResourceGroupListRequest {
  repeated string filter_resource_groups = 1;
  // "key" or "key=value" property filters, all have to match
  repeated string filter_props = 2;
  optional PagingRequest paging = 3;
}

message ResourceGroupListResponse {
  repeated ResourceGroup resource_groups = 1;
  Paging paging = 2;
}

message VolumeGroupCreate {
  // absent: next free volume number
  optional uint32 volume_number = 1;
  map<string, string> props = 2;
  repeated VolumeGroupFlag flags = 3;
}

message ResourceGroupCreateRequest {
  string name = 1;
  optional string description = 2;
  map<string, string> props = 3;
  optional AutoSelectFilter select_filter = 4;
  optional uint32 peer_slots = 5;
  repeated VolumeGroupCreate volume_groups = 6;
}

message ResourceGroupModifyRequest {
  string rsc_group_name = 1;
  optional string description = 2;
  PropsModify props_mod = 3;
  optional AutoSelectFilter select_filter = 4;
  optional uint32 peer_slots = 5;
  // snapshots to copy to newly placed resources when the modify triggers an
  // adjust (e.g. because place_count changed); not part of the object state,
  // so not subject to update_mask
  repeated string snap_names = 6;
  bool copy_all_snaps = 7;
  // updatable paths: description, peer_slots and the filter fields stored in
  // a resource group: select_filter.place_count (cannot be cleared),
  // select_filter.node_name_list, select_filter.storage_pool_list,
  // select_filter.storage_pool_diskless_list, select_filter.not_place_with_rsc,
  // select_filter.not_place_with_rsc_regex, select_filter.replicas_on_same,
  // select_filter.replicas_on_different, select_filter.x_replicas_on_different_map,
  // select_filter.layer_stack, select_filter.provider_list,
  // select_filter.diskless_on_remaining. "select_filter" alone replaces the
  // whole filter and therefore requires place_count to be set.
  google.protobuf.FieldMask update_mask = 8;
}

message ResourceGroupDeleteRequest {
  string rsc_group_name = 1;
}

message ResourceGroupSpawnRequest {
  string rsc_group_name = 1;
  // name of the resulting resource definition
  string resource_definition_name = 2;
  optional string resource_definition_external_name = 3;
  // sizes (in KiB) of the resulting volume definitions
  repeated uint64 volume_sizes = 4;
  // overrides the filter stored in the resource group for this spawn only
  optional AutoSelectFilter select_filter = 5;
  // If false, the number of volume_sizes has to match the number of volume
  // groups. If true, additional volume_sizes create volume definitions
  // without pre-set properties and surplus volume groups are ignored.
  bool partial = 6;
  // only create the resource and volume definitions, do not place resources
  bool definitions_only = 7;
  optional uint32 peer_slots = 8;
  // passphrases for encrypted volumes, one per volume definition
  repeated string volume_passphrases = 9;
  // properties to set on the new resource definition
  map<string, string> resource_definition_props = 10;
}

message ResourceGroupAdjustRequest {
  string rsc_group_name = 1;
  optional AutoSelectFilter select_filter = 2;
  repeated string snap_names = 3;
  bool copy_all_snaps = 4;
}

message ResourceGroupAdjustAllRequest {
  optional AutoSelectFilter select_filter = 1;
  repeated string snap_names = 2;
  bool copy_all_snaps = 3;
}

message QuerySizeInfoSpawnResult {
  string node_name = 1;
  string stor_pool_name = 2;
  double stor_pool_oversubscription_ratio = 3;
  double stor_pool_free_capacity_oversubscription_ratio = 4;
  double stor_pool_total_capacity_oversubscription_ratio = 5;
}

message QuerySizeInfoSpaceInfo {
  // maximum size in KiB a single volume could have
  uint64 max_vlm_size_in_kib = 1;
  // available size of the selected storage pools in KiB
  uint64 available_size_in_kib = 2;
  // capacity of the selected storage pools in KiB
  uint64 capacity_in_kib = 3;
  double default_max_oversubscription_ratio = 4;
  // storage pools the next spawn would be placed on
  repeated QuerySizeInfoSpawnResult next_spawn_result = 5;
}

message ResourceGroupQuerySizeInfoRequest {
  string rsc_group_name = 1;
  // overrides the filter stored in the resource group for this query only
  optional AutoSelectFilter select_filter = 2;
  // reuse a cached result if it is younger than this many seconds;
  // 0 (default) always recomputes
  uint32 ignore_cache_older_than_sec = 3;
}

// space_info is absent if the query failed, the failure is then described in
// reports
message QuerySizeInfoResponse {
  optional QuerySizeInfoSpaceInfo space_info = 1;
  repeated Answer reports = 2;
}

message ResourceGroupQueryAllSizeInfoRequest {
  // applied on top of every resource group's stored filter
  optional AutoSelectFilter select_filter = 1;
  // reuse a cached result if it is younger than this many seconds;
  // 0 (default) always recomputes
  uint32 ignore_cache_older_than_sec = 2;
}

message ResourceGroupQueryAllSizeInfoResponse {
  // key: resource group name
  map<string, QuerySizeInfoResponse> result = 1;
  repeated Answer reports = 2;
}

message VolumeGroupListRequest {
  string rsc_group_name = 1;
  // absent: list all volume groups of the resource group
  optional uint32 volume_number = 2;
  optional PagingRequest paging = 3;
}

message VolumeGroupListResponse {
  repeated VolumeGroup volume_groups = 1;
  Paging paging = 2;
}

message VolumeGroupCreateRequest {
  string rsc_group_name = 1;
  VolumeGroupCreate volume_group = 2;
}

message VolumeGroupModifyRequest {
  string rsc_group_name = 1;
  uint32 volume_number = 2;
  PropsModify props_mod = 3;
  repeated VolumeGroupFlag set_flags = 4;
  repeated VolumeGroupFlag unset_flags = 5;
}

message VolumeGroupDeleteRequest {
  string rsc_group_name = 1;
  uint32 volume_number = 2;
}
