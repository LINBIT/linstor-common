syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.linbit.linstor.api.grpc";
option java_outer_classname = "CommonProto";

package linbit.linstor;

message Uuid {
  fixed64 high = 1;
  fixed64 low = 2;
}

message Paging {
  uint64 count = 1;
  uint64 limit = 2;
  uint64 offset = 3;
}

// One sort key of a list request, see the sorting rules below.
message SortField {
  // field of the listed message, nested fields joined with '.', e.g. "name",
  // "connection_status" or "select_filter.place_count"; a map field takes the
  // key as last segment, e.g. "props.Aux/site"
  string field = 1;
  bool descending = 2;
}

// List requests take an optional PagingRequest. Sorting happens before
// limit/offset are applied and follows these rules:
//   * sort fields name fields of the listed message; scalar, string and enum
//     fields are sortable, repeated fields are not; a map field is sorted by
//     the value of the given key ("props.Aux/site")
//   * strings compare case-insensitively (like LINSTOR object names), enums by
//     their name, numbers numerically, booleans false before true
//   * absent values (unset optional fields, missing map keys) sort last in
//     both directions
//   * ties keep the controller's default order, which is also the order of a
//     request without sort fields
//   * unknown or unsortable fields are rejected with INVALID_ARGUMENT; the
//     error lists the sortable fields
message PagingRequest {
  uint64 limit = 2;
  uint64 offset = 3;
  repeated SortField sort = 4;
}

// Common property modification set, shared by all object modify requests.
message PropsModify {
  map<string, string> override_props = 1;
  repeated string delete_props = 2;
  repeated string delete_namespaces = 3;
}

// Modify requests that change object state carry a google.protobuf.FieldMask
// "update_mask" and follow these rules:
//   * the mask is required; an empty mask is rejected with INVALID_ARGUMENT
//   * paths are field names of the request message, e.g. "description" or
//     "select_filter.place_count"; a path naming a message covers all of its
//     fields
//   * a field in the mask is applied: if it is set in the request its value
//     replaces the stored one, if it is absent (or an empty list/map) the
//     stored value is cleared; fields that cannot be cleared are rejected
//     with INVALID_ARGUMENT
//   * a field not in the mask is ignored, even if it is set in the request
//   * property modifications (override/delete) are fields like any other:
//     they are applied only when listed in the mask; listing them with an
//     empty modification is a no-op
//   * paths that are no updatable fields (identifiers, ...) are rejected
//     with INVALID_ARGUMENT
// Every modify request documents its updatable paths.

// Common api reply structure
message Answer {
  // A masked error number
  uint64 ret_code = 1;
  string message = 2;
  // Cause of the error
  string cause = 3;
  // Details to the error message
  string details = 4;
  // Possible correction options
  string correction = 5;
  // List of error report ids related to this api call return code.
  repeated string error_report_ids = 6;
  // Map of objection that have been involved by the operation.
  map<string, string> obj_refs = 7;
}
